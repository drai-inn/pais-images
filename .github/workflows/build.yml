name: build

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build.yml"
    tags:
      - "python-base-v*"
      - "slicer-desktop-v*"
      - "runai-mcp-server-v*"
      - "nfs-server-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Which images changed. Every push to main is an image RELEASE (workspaces pull :latest with
# imagePullPolicy: Always), so a build must only run for images whose own source actually moved.
# Nothing in these Dockerfiles pins apt, and uv/miniforge/Slicer/KasmVNC/VirtualGL all move
# upstream independently, so an unnecessary rebuild silently ships a different image.
#
# Note what is deliberately NOT a trigger: this workflow file. Editing CI is not a reason to
# republish every image. Use the workflow_dispatch button when a CI change needs a rebuild proving.
# On a tag push there is no diff to compute, so every image builds.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python-base: ${{ steps.filter.outputs.python-base }}
      slicer-desktop: ${{ steps.filter.outputs.slicer-desktop }}
      runai-mcp-server: ${{ steps.filter.outputs.runai-mcp-server }}
      nfs-server: ${{ steps.filter.outputs.nfs-server }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python-base:
              - 'images/python-base/**'
            slicer-desktop:
              - 'images/slicer-desktop/**'
            runai-mcp-server:
              - 'images/runai-mcp-server/**'
            nfs-server:
              - 'images/nfs-server/**'

  python-base:
    needs: changes
    if: needs.changes.outputs.python-base == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/drai-inn/pais-images/python-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: images/python-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  slicer-desktop:
    needs: changes
    if: needs.changes.outputs.slicer-desktop == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/drai-inn/pais-images/slicer-desktop
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: images/slicer-desktop
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run:ai MCP server, from dsx-ai-factory/run-ai at the tag in images/runai-mcp-server/VERSION. Tagged with that
  # version (no `latest`): deployments pin a version, and a new VERSION is a new release.
  runai-mcp-server:
    needs: changes
    if: needs.changes.outputs.runai-mcp-server == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(tr -d '[:space:]' < images/runai-mcp-server/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/drai-inn/pais-images/runai-mcp-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: images/runai-mcp-server
          platforms: linux/amd64
          build-args: RUNAI_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The kernel NFS server's user-space side, Ubuntu nfs-kernel-server at the version in images/nfs-server/VERSION.
  # Tagged with that version (no `latest`): deployments pin a version by digest, and a new VERSION is a new release.
  nfs-server:
    needs: changes
    if: needs.changes.outputs.nfs-server == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(tr -d '[:space:]' < images/nfs-server/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/drai-inn/pais-images/nfs-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: images/nfs-server
          platforms: linux/amd64
          build-args: NFS_UTILS_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
